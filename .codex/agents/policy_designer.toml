## 常见问题

### 什么时候用规则策略 vs 学习型策略？
- 场景是确定性几何博弈（如 drone_ring_game）→ 规则策略足够
- 场景有随机性或复杂动力学 → 从 PPO/SAC 开始
- 场景有显式对抗 → MAPPO/MADDPG
- M1 默认使用规则策略

### PolicyClass 构造失败怎么办？
Hook 验证支持三种构造签名：
1. `PolicyClass(config)` — 仅配置
2. `PolicyClass(config, env_spec)` — 配置 + 环境规格
3. `PolicyClass()` — 无参数（使用内建默认值）
至少实现其中一种即可通过验证。

### 训练入口可以是 no-op 吗？
可以。对于规则策略，train.py 可以只是 `pass`（退出码 0），因为规则策略不需要训练。但 train.py 的 CLI 签名（参数列表）必须完整，以便 AutoResearch Agent 调用。
