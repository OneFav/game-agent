schema_version: "1.0"
task_id: slalom_1v1_3d_001
task_family: drone_ring_game
formalism: MarkovGame
agents:
  - id: red_racer_0
    team: red
    role: racer
    objective: maximize_red_team_score
  - id: blue_racer_0
    team: blue
    role: racer
    objective: deny_red_team_score
communication:
  mode: perfect
scenario_parameters:
  engine: swarm_combat
  semantic_task_family: swarm_combat
  gate_layout: slalom
  gate_count: 5
  dynamics: DoubleIntegrator3D
  max_steps: 400
  team_score_definition: Red team cumulative sequential gate score with gate_pass_reward fixed to 1.0.
  compatibility_note: Shared scenario schema still uses task_family=drone_ring_game, so 3D swarm semantics are frozen inside env.py and env_config.yaml.
