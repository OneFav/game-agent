parameters:
  blue_desired_speed:
    type: number
    range: [6.4, 7.6]
    values: [6.4, 7.0, 7.6]
    default: 7.0
  blue_risk_margin:
    type: number
    range: [0.8, 1.4]
    values: [0.8, 1.1, 1.4]
    default: 1.1
  blue_lane_spacing:
    type: number
    range: [1.4, 2.0]
    values: [1.4, 1.7, 2.0]
    default: 1.7
  blue_intercept_gain:
    type: number
    range: [1.4, 3.4]
    values: [1.8, 2.6, 3.2]
    default: 2.6
  blue_intercept_radius:
    type: number
    range: [4.0, 9.0]
    values: [5.0, 7.0, 9.0]
    default: 7.0
  blue_pressure_buffer:
    type: number
    range: [0.2, 1.2]
    values: [0.4, 0.7, 1.0]
    default: 0.7
  blue_defender_mode:
    type: string
    values: [intercept, escort]
    default: intercept
  red_desired_speed:
    type: number
    range: [6.4, 6.4]
    values: [6.4]
    default: 6.4
  red_risk_margin:
    type: number
    range: [0.8, 0.8]
    values: [0.8]
    default: 0.8
  red_lane_spacing:
    type: number
    range: [1.6, 1.6]
    values: [1.6]
    default: 1.6
  red_defender_mode:
    type: string
    values: [escort]
    default: escort
  shared_position_gain:
    type: number
    range: [1.3, 1.3]
    values: [1.3]
    default: 1.3
  shared_velocity_gain:
    type: number
    range: [2.2, 2.2]
    values: [2.2]
    default: 2.2
  shared_boundary_margin:
    type: number
    range: [1.2, 1.2]
    values: [1.2]
    default: 1.2
  shared_turn_steps:
    type: integer
    range: [12, 12]
    values: [12]
    default: 12
  shared_turn_lookahead:
    type: number
    range: [6.0, 6.0]
    values: [6.0]
    default: 6.0
  shared_risk_lookahead_steps:
    type: integer
    range: [18, 18]
    values: [18]
    default: 18
  shared_brake_release_speed:
    type: number
    range: [0.35, 0.35]
    values: [0.35]
    default: 0.35
  shared_gate_approach_offset:
    type: number
    range: [4.5, 4.5]
    values: [4.5]
    default: 4.5
  shared_gate_exit_offset:
    type: number
    range: [3.5, 3.5]
    values: [3.5]
    default: 3.5
  shared_separation_gain:
    type: number
    range: [4.5, 4.5]
    values: [4.5]
    default: 4.5
priority_groups:
  priority_1:
    - blue_desired_speed
    - blue_risk_margin
    - blue_lane_spacing
    - blue_intercept_gain
    - blue_intercept_radius
    - blue_pressure_buffer
  priority_2:
    - blue_defender_mode
  do_not_tune:
    - red_desired_speed
    - red_risk_margin
    - red_lane_spacing
    - red_defender_mode
    - shared_position_gain
    - shared_velocity_gain
    - shared_boundary_margin
    - shared_turn_steps
    - shared_turn_lookahead
    - shared_risk_lookahead_steps
    - shared_brake_release_speed
    - shared_gate_approach_offset
    - shared_gate_exit_offset
    - shared_separation_gain
budget:
  max_trials: 12
  seeds_per_trial: 3
