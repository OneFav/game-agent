parameters:
  desired_speed:
    type: number
    values: [4.0, 4.5, 5.0]
    default: 5.0
    priority: priority_1
  risk_margin:
    type: number
    values: [0.75, 0.9, 1.05]
    default: 0.9
    priority: priority_1
  position_gain:
    type: number
    min: 0.5
    max: 2.0
    default: 1.2
    priority: priority_2
  velocity_gain:
    type: number
    min: 1.0
    max: 3.5
    default: 2.2
    priority: priority_2
  boundary_margin:
    type: number
    min: 0.8
    max: 2.0
    default: 1.2
    priority: priority_2
  turn_steps:
    type: integer
    min: 6
    max: 24
    default: 12
    priority: priority_2
  turn_lookahead:
    type: number
    min: 3.0
    max: 8.0
    default: 5.0
    priority: priority_2
  risk_lookahead_steps:
    type: integer
    min: 10
    max: 32
    default: 18
    priority: priority_2
  brake_release_speed:
    type: number
    min: 0.1
    max: 0.8
    default: 0.35
    priority: priority_2
  lane_spacing:
    type: number
    min: 0.6
    max: 2.0
    default: 1.2
    priority: priority_2
  gate_approach_offset:
    type: number
    min: 2.0
    max: 6.0
    default: 4.0
    priority: priority_2
  gate_exit_offset:
    type: number
    min: 2.0
    max: 6.0
    default: 3.0
    priority: priority_2
  separation_gain:
    type: number
    min: 2.0
    max: 6.0
    default: 4.0
    priority: priority_2
  reserved_action_value:
    type: number
    values: [0.0]
    default: 0.0
    priority: do_not_tune
budget:
  max_trials: 9
  seeds_per_trial: 3
