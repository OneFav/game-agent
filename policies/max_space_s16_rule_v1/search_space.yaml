parameters:
  gain:
    type: number
    minimum: 0.4
    maximum: 1.6
    default: 1.0
    values:
    - 0.8
    - 1.0
    - 1.2
  damping:
    type: number
    minimum: 0.0
    maximum: 1.2
    default: 0.55
    values:
    - 0.55
    - 0.65
  action_cap:
    type: number
    minimum: 0.4
    maximum: 1.0
    default: 1.0
    values:
    - 1.0
priority_groups:
  priority_1:
  - gain
  - damping
  - action_cap
  priority_2: []
  do_not_tune:
  - strategy
  - policy_id
  - rate_limit
  - communication_decay
  - role_gain
budget:
  max_trials: 12
  seeds_per_trial: 3
  max_train_steps: 0
  wall_time_limit_seconds: 30
  log_interval: 1
